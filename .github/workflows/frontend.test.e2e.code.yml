name: "frontend:test:e2e test code with playwright"

on: push

jobs:
  files-changed:
    name: Detect File Changes - frontend-test-e2e-code
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.changes.outputs.filter }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.1.7
      - name: Check for frontend file changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: changes
        with:
          token: ${{ github.token }}
          filters: |
            filter:
              - 'frontend/**/*'
              - '.github/workflows/*'
          list-files: shell

  e2e:
    if: needs.files-changed.outputs.changes == 'true'
    name: E2E - Frontend
    needs: files-changed
    runs-on: ubuntu-latest
    env:
      WORKING_DIRECTORY: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.1.7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.tool-versions

      - name: Env File
        run: cp .env.example .env
        working-directory: ${{env.WORKING_DIRECTORY}}

      - name: Install dependencies
        run: npm ci
        working-directory: ${{env.WORKING_DIRECTORY}}

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        working-directory: ${{env.WORKING_DIRECTORY}}

      - name: Run E2E tests
        run: npm run test:e2e
        working-directory: ${{env.WORKING_DIRECTORY}}

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30
