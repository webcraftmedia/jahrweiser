version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 99
    groups:
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@nuxt/test-utils"
      # @size-limit/file peer-pins size-limit to the exact same version, so a
      # PR that moves only one of them can never install — see #315/#317.
      size-limit:
        patterns:
          - "size-limit"
          - "@size-limit/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 99

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 99
