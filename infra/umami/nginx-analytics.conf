# analytics.webcraft-media.de — Umami dashboard.
#
# This file belongs on the PUBLIC REVERSE PROXY, not on the Umami LXC.
# The LXC has no public address; nginx reaches it over WireGuard.
#
# Two access paths exist and they are deliberately different:
#
#   public   https://analytics.webcraft-media.de   UI + dashboard API (you)
#   internal http://<lxc-wg-ip>:3000/api/send      ingest (the app hosts only)
#
# The ingest path never travels through this hostname: nuxt-umami runs in
# `proxy: 'cloak'` mode, so browsers POST to the product's own domain and the
# product's Nitro server forwards to Umami server-to-server over WireGuard.
# That is also why ad-blocker filter lists cannot cost a single pageview here —
# at worst they hide your own dashboard.
#
# Replace the three placeholders: UMAMI_WG_IP, and the two certificate paths.

upstream umami {
    server UMAMI_WG_IP:3000;
    keepalive 8;
}

# Brute-force floor for the login form. A publicly reachable analytics login
# with a well-known default account (admin/umami) gets probed within days.
limit_req_zone $binary_remote_addr zone=umami_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name analytics.webcraft-media.de;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name analytics.webcraft-media.de;

    ssl_certificate     /etc/letsencrypt/live/analytics.webcraft-media.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/analytics.webcraft-media.de/privkey.pem;

    # A dashboard has no business in a search index, and its referrers should
    # not leak which sites are being measured.
    add_header X-Robots-Tag        "noindex, nofollow" always;
    add_header Referrer-Policy     "same-origin"       always;
    add_header X-Content-Type-Options "nosniff"        always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 2m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    location = /api/auth/login {
        limit_req zone=umami_login burst=5 nodelay;
        proxy_pass http://umami;
    }

    # Ingest stays internal. Opening it here would make the statistics
    # writable by anyone who learns a websiteId — and would put the hostname
    # back on ad-blocker lists, for no gain as long as every product uses the
    # cloak proxy. Flip to proxy_pass only if a product ever needs direct
    # browser ingest, and add an Origin allowlist when you do.
    location = /api/send {
        return 404;
    }

    # Realtime view polls; keep the timeout comfortable.
    location /api/realtime/ {
        proxy_pass http://umami;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://umami;
    }
}
